    />

    <script type="text/javascript">
      console.time('scriptToView');
      window.PUBLIC_URL = '<%= PUBLIC_URL %>';
    </script>
    <link
      rel="manifest"

    <style>
      :root,

        --background: 220 18% 6% !important;
        --foreground: 220 14% 96% !important;
        --card: 220 16% 9% !important;
        --card-foreground: 220 14% 96% !important;
        --popover: 220 16% 11% !important;
        --popover-foreground: 220 14% 96% !important;
        --muted: 220 15% 14% !important;
        --muted-foreground: 220 9% 65% !important;
        --accent: 220 15% 18% !important;
        --accent-foreground: 220 14% 98% !important;
        --border: 220 14% 18% !important;
        --input: 220 14% 13% !important;
        --primary: 170 100% 39% !important;
        --primary-foreground: 0 0% 100% !important;
        --highlight: 169 82% 54% !important;
        --ring: 170 100% 39% !important;
        --secondary: 170 45% 22% !important;
        --secondary-foreground: 170 60% 88% !important;
        --neutral: 220 12% 50% !important;
        --neutral-light: 220 14% 75% !important;
        --neutral-dark: 220 16% 14% !important;
      }
    </style>
